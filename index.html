<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>حاسبة نمو الحيوان — كم بيعطي باللفل المستهدف</title>

<!-- iPhone / PWA support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حاسبة النمو">
<meta name="theme-color" content="#08070f">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232a2738'/%3E%3Cstop offset='1' stop-color='%2317151f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='192' height='192' rx='44' fill='url(%23g)'/%3E%3Crect x='44' y='128' width='28' height='42' rx='7' fill='%238aa0d6'/%3E%3Crect x='86' y='98' width='28' height='72' rx='7' fill='%23b39ddb'/%3E%3Crect x='128' y='66' width='28' height='104' rx='7' fill='%237fc9a3'/%3E%3Cpolygon points='118,26 78,90 98,90 84,132 132,68 106,68' fill='%23d9a75c' stroke='%2317151f' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232a2738'/%3E%3Cstop offset='1' stop-color='%2317151f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='192' height='192' rx='44' fill='url(%23g)'/%3E%3Crect x='44' y='128' width='28' height='42' rx='7' fill='%238aa0d6'/%3E%3Crect x='86' y='98' width='28' height='72' rx='7' fill='%23b39ddb'/%3E%3Crect x='128' y='66' width='28' height='104' rx='7' fill='%237fc9a3'/%3E%3Cpolygon points='118,26 78,90 98,90 84,132 132,68 106,68' fill='%23d9a75c' stroke='%2317151f' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- ⬇️ احتفظ هنا بأسطر <link rel="manifest"> من ملفك الأصلي كما هي -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12121a;
    --glass:rgba(32,29,46,0.5);
    --glass-2:rgba(40,36,54,0.36);
    --line:rgba(255,255,255,0.075);
    --line-strong:rgba(255,255,255,0.13);
    --blue:#8aa0d6;
    --purple:#b39ddb;
    --gold:#d9a75c;
    --gold-soft:#ecd9ab;
    --green:#7fc9a3;
    --pink:#d896a8;
    --text:#f1ede6;
    --text-dim:#b6b1c4;
    --text-faint:#726d84;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
    padding-top:calc(28px + env(safe-area-inset-top));
    padding-bottom:calc(60px + env(safe-area-inset-bottom));
    overflow-x:hidden;
    position:relative;
  }

  /* ═══════════ خلفية حيّة: هالات + نجوم ═══════════ */
  .aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;}
  .aurora i{
    position:absolute;border-radius:50%;
    filter:blur(100px);opacity:.32;
    animation:float 16s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(1){width:520px;height:520px;top:-14%;right:-10%;background:radial-gradient(circle,#4a5578,transparent 70%);}
  .aurora i:nth-child(2){width:460px;height:460px;bottom:-12%;left:-8%;background:radial-gradient(circle,#5c4f74,transparent 70%);animation-delay:-6s;}
  .aurora i:nth-child(3){width:320px;height:320px;top:38%;left:50%;background:radial-gradient(circle,rgba(180,140,90,.4),transparent 70%);animation-delay:-11s;opacity:.2;}
  @keyframes float{
    from{transform:translate(0,0) scale(1);}
    to{transform:translate(-40px,50px) scale(1.12);}
  }
  #stars{position:fixed;inset:0;z-index:-1;pointer-events:none;}

  .wrap{max-width:900px;margin:0 auto;}

  /* ═══════════ HERO ═══════════ */
  .hero{text-align:center;padding:16px 10px 32px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:700;font-size:13px;
    letter-spacing:.16em;
    color:var(--text-faint);
    margin-bottom:14px;
  }
  .eyebrow em{
    font-style:normal;
    background:linear-gradient(90deg,var(--blue),var(--purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .eyebrow::before,.eyebrow::after{
    content:"";width:24px;height:1px;
    background:linear-gradient(90deg,transparent,var(--blue));opacity:.6;
  }
  .eyebrow::after{background:linear-gradient(90deg,var(--purple),transparent);}
  h1{
    font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;
    font-size:clamp(28px,5.4vw,48px);line-height:1.22;margin:0 0 14px;
    letter-spacing:-.01em;
  }
  h1 .accent{
    background:linear-gradient(120deg,var(--gold-soft),var(--gold) 55%,#ff9e3d);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(217,167,92,.35));
  }
  .sub{color:var(--text-dim);font-size:15px;max-width:560px;margin:0 auto;line-height:1.95;}
  .logo-icon{
    width:88px;height:88px;margin:0 auto 16px;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.55));
  }
  .logo-title{
    font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;
    font-size:22px;color:var(--text);text-align:center;margin:0 0 6px;
  }

  /* ═══════════ البطاقة الزجاجية بحدّ متوهج ═══════════ */
  .card{
    position:relative;
    background:linear-gradient(160deg,var(--glass),var(--glass-2));
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border-radius:26px;
    padding:26px 24px 28px;
    margin-bottom:22px;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.04);
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0;border-radius:26px;padding:1px;
    background:conic-gradient(from var(--a,0deg),
      rgba(138,160,214,.55),rgba(179,157,219,.12),rgba(217,167,92,.4),
      rgba(179,157,219,.12),rgba(138,160,214,.55));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:spin 13s linear infinite;
    pointer-events:none;
  }
  @property --a{syntax:'<angle>';initial-value:0deg;inherits:false;}
  @keyframes spin{to{--a:360deg;}}

  .section-tag{
    font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;
    letter-spacing:.1em;color:var(--text-faint);text-transform:uppercase;
    margin:0 0 16px;display:flex;align-items:center;gap:8px;
  }
  .section-tag::after{content:"";flex:1;height:1px;background:var(--line);}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  @media (max-width:560px){.field-row{grid-template-columns:1fr;}}

  label{display:block;font-size:13px;font-weight:700;color:var(--text-dim);margin-bottom:8px;padding-inline-start:2px;}
  label .hint{font-weight:400;color:var(--text-faint);font-size:11.5px;}

  .input-shell{
    display:flex;align-items:center;
    background:rgba(6,6,16,.7);
    border:1.5px solid var(--line);
    border-radius:15px;padding:0 4px 0 10px;
    transition:border-color .2s,box-shadow .25s,transform .15s;
  }
  .input-shell:focus-within{
    border-color:var(--blue);
    box-shadow:0 0 0 4px rgba(138,160,214,.14),0 0 22px rgba(138,160,214,.22);
  }
  .input-shell .badge{
    font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:700;font-size:12.5px;
    color:var(--blue);background:rgba(138,160,214,.13);
    border:1px solid rgba(138,160,214,.22);
    border-radius:9px;padding:6px 9px;margin:7px 0 7px 8px;
    letter-spacing:.02em;
  }
  input[type=text],input[type=number]{
    flex:1;min-width:0;background:transparent;border:0;outline:0;
    color:var(--text);font-family:'Space Mono',monospace;
    font-size:16.5px;font-weight:700;padding:13px 4px;
    direction:ltr;text-align:left;
  }
  input::placeholder{color:var(--text-faint);font-family:'Cairo',sans-serif;font-weight:400;}

  /* أزرار سريعة للهدف */
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .quick button{
    cursor:pointer;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--text-dim);
    font-family:'Space Mono',monospace;font-weight:700;font-size:11.5px;
    border-radius:100px;padding:6px 14px;
    transition:all .18s;
  }
  .quick button:hover{
    border-color:var(--green);color:var(--green);
    background:rgba(127,201,163,.08);transform:translateY(-1px);
  }

  /* منتقي المضاعِف (K/M/B/...) */
  .suffix-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
  .suffix-row button{
    cursor:pointer;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--text-dim);
    font-family:'Space Mono',monospace;font-weight:700;font-size:12px;
    border-radius:10px;padding:7px 0;width:44px;text-align:center;
    transition:all .16s;
  }
  .suffix-row button:hover{border-color:var(--line-strong);color:var(--text);}
  .suffix-row button.active{
    background:linear-gradient(135deg,rgba(217,167,92,.18),rgba(217,167,92,.06));
    border-color:var(--gold);color:var(--gold-soft);
    box-shadow:0 0 14px rgba(217,167,92,.18);
  }
  .suffix-hint{font-size:11px;color:var(--text-faint);margin-top:8px;font-family:'Cairo',sans-serif;}
  .suffix-hint b{color:var(--text-dim);}

  /* ═══════════ زر الحساب ═══════════ */
  .calc-btn{
    position:relative;width:100%;margin-top:22px;
    border:0;cursor:pointer;border-radius:16px;padding:16px 20px;
    font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:18px;
    color:#191333;
    background:linear-gradient(100deg,var(--gold),var(--gold-soft) 50%,#ffb02e);
    box-shadow:0 14px 32px -12px rgba(217,167,92,.55),inset 0 -3px 0 rgba(0,0,0,.16);
    transition:transform .13s ease,filter .2s,box-shadow .2s;
    overflow:hidden;
  }
  .calc-btn::after{
    content:"";position:absolute;top:0;left:-80%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-22deg);animation:shine 5s ease-in-out infinite;
  }
  @keyframes shine{0%,60%{left:-80%;}82%,100%{left:130%;}}
  .calc-btn:hover{filter:brightness(1.05);transform:translateY(-2px);box-shadow:0 18px 36px -12px rgba(217,167,92,.65),inset 0 -3px 0 rgba(0,0,0,.16);}
  .calc-btn:active{transform:translateY(1px);}
  .shake{animation:shake .4s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-7px);}
    50%{transform:translateX(7px);}
    75%{transform:translateX(-4px);}
  }

  /* ═══════════ النتيجة ═══════════ */
  .result{
    margin-top:26px;border-top:1px solid var(--line);
    padding-top:26px;text-align:center;display:none;
  }
  .result.show{display:block;animation:fadeUp .6s cubic-bezier(.2,.8,.3,1);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

  .result-label{font-size:13px;color:var(--text-dim);font-weight:600;margin-bottom:10px;}
  .result-number{
    font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;
    font-size:clamp(38px,9vw,60px);
    direction:ltr;letter-spacing:.01em;
    background:linear-gradient(120deg,#7fc9a3,#c9e8d8 50%,#7fc9a3);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(127,201,163,.4));
  }
  .result-number span.unit{font-size:.46em;-webkit-text-fill-color:var(--text-dim);}
  .result-sub{margin-top:10px;font-family:'Space Mono',monospace;font-size:12.5px;color:var(--text-faint);direction:ltr;}

  .chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
  .chip{
    font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:100px;
    background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text-dim);
    backdrop-filter:blur(8px);
  }
  .chip b{color:var(--gold-soft);font-family:'Space Mono',monospace;}
  .chip.up b{color:var(--green);}

  /* شريط التقدم نحو الهدف */
  .progress-wrap{margin:22px auto 0;max-width:420px;text-align:right;}
  .progress-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);margin-bottom:7px;font-family:'Space Mono',monospace;direction:ltr;}
  .progress-bar{height:8px;border-radius:100px;background:rgba(255,255,255,.06);overflow:hidden;border:1px solid var(--line);}
  .progress-fill{
    height:100%;width:0;border-radius:100px;
    background:linear-gradient(90deg,var(--gold),var(--green));
    box-shadow:0 0 12px rgba(127,201,163,.4);
    transition:width 1.1s cubic-bezier(.2,.8,.3,1);
  }

  /* ═══════════ الرسم البياني ═══════════ */
  .chart-card{
    position:relative;
    background:linear-gradient(160deg,var(--glass),var(--glass-2));
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border:1px solid var(--line);border-radius:26px;
    padding:22px 18px 12px;margin-bottom:22px;
  }
  .chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
  .chart-title{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:700;font-size:15.5px;}
  .chart-title small{display:block;font-family:'Cairo',sans-serif;font-weight:400;font-size:11.5px;color:var(--text-faint);margin-top:3px;}
  .legend{display:flex;gap:13px;font-size:11px;color:var(--text-dim);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  canvas#chart{width:100%;display:block;cursor:crosshair;}
  .tooltip{
    position:absolute;pointer-events:none;z-index:5;
    background:rgba(10,9,24,.94);border:1px solid rgba(138,160,214,.35);
    border-radius:10px;padding:7px 11px;
    font-family:'Space Mono',monospace;font-size:12px;color:var(--text);
    direction:ltr;white-space:nowrap;display:none;
    box-shadow:0 8px 22px rgba(0,0,0,.5);
    transform:translate(-50%,-115%);
  }
  .tooltip b{color:var(--green);}

  /* ═══════════ مصدر البيانات ═══════════ */
  details{
    background:var(--glass);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:18px;
    padding:15px 20px;margin-bottom:14px;
  }
  summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--text-dim);display:flex;align-items:center;justify-content:space-between;}
  summary::-webkit-details-marker{display:none;}
  summary::after{content:"＋";color:var(--blue);font-size:16px;transition:transform .25s;}
  details[open] summary::after{content:"－";}
  .src-table{width:100%;border-collapse:collapse;margin-top:14px;font-family:'Space Mono',monospace;font-size:12px;direction:ltr;}
  .src-table th,.src-table td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);color:var(--text-dim);}
  .src-table th{color:var(--text-faint);font-weight:700;font-size:10.5px;}
  .src-table tr:hover td{background:rgba(138,160,214,.06);color:var(--text);}
  .src-note{margin-top:12px;font-size:12.5px;color:var(--text-faint);line-height:1.9;font-family:'Cairo',sans-serif;}

  .foot{text-align:center;color:var(--text-faint);font-size:11.5px;margin-top:26px;line-height:2;}
</style>
</head>
<body>

<div class="aurora"><i></i><i></i><i></i></div>
<canvas id="stars"></canvas>

<div class="wrap">

  <div class="hero">
    <svg class="logo-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2a2738"/>
          <stop offset="1" stop-color="#17151f"/>
        </linearGradient>
      </defs>
      <rect x="4" y="4" width="192" height="192" rx="44" fill="url(#logoBg)" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
      <rect x="44" y="128" width="28" height="42" rx="7" fill="#8aa0d6"/>
      <rect x="86" y="98" width="28" height="72" rx="7" fill="#b39ddb"/>
      <rect x="128" y="66" width="28" height="104" rx="7" fill="#7fc9a3"/>
      <polygon points="118,26 78,90 98,90 84,132 132,68 106,68" fill="#d9a75c" stroke="#17151f" stroke-width="3" stroke-linejoin="round"/>
    </svg>
    <div class="logo-title">حاسبة النمو</div>
    <div class="eyebrow">GO UP FOR <em>BRAINROTS</em></div>
  </div>

  <div class="card">
    <div class="section-tag">بيانات حيوانك</div>
    <div class="field-row">
      <div>
        <label>اللفل الحالي <span class="hint">(1–300)</span></label>
        <div class="input-shell">
          <span class="badge">LVL</span>
          <input type="number" id="curLevel" placeholder="مثال: 111" min="1" step="1">
        </div>
      </div>
      <div>
        <label>الإنتاج الحالي <span class="hint">(بالثانية)</span></label>
        <div class="input-shell">
          <span class="badge">$/s</span>
          <input type="text" inputmode="decimal" id="curProdNum" placeholder="مثال: 2.99">
        </div>
        <div class="suffix-row" id="suffixRow"></div>
        <div class="suffix-hint">اختر وحدة الرقم — القيمة الكاملة: <b id="fullValuePreview">—</b></div>
      </div>
    </div>

    <div class="field-row" style="grid-template-columns:1fr;margin-bottom:0;">
      <div>
        <label>اللفل المستهدف</label>
        <div class="input-shell">
          <span class="badge">LVL</span>
          <input type="number" id="targetLevel" placeholder="مثال: 300" min="1" step="1">
        </div>
        <div class="quick">
          <button onclick="quickTarget(10)">+10</button>
          <button onclick="quickTarget(50)">+50</button>
          <button onclick="quickTarget(100)">+100</button>
          <button onclick="setTarget(300)">MAX 300 ⭐</button>
        </div>
      </div>
    </div>

    <button class="calc-btn" id="calcBtn" onclick="calculate()">احسب الناتج ⚡</button>

    <div class="result" id="resultBox">
      <div class="result-label">توقع الإنتاج عند <span id="resLevelLabel" style="color:#fff"></span></div>
      <div class="result-number" id="resultNumber">—</div>
      <div class="result-sub" id="resultRaw"></div>
      <div class="chips">
        <div class="chip up">زيادة عن الحالي <b id="chipMultiplier">—</b></div>
        <div class="chip">الفرق <b id="chipDiff">—</b></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-meta"><span id="progFrom">LVL 1</span><span id="progPct">0%</span><span id="progTo">LVL 300</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
      </div>
    </div>
  </div>


</div>

<script>
/* ═══════════ نجوم متحركة في الخلفية ═══════════ */
(function(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize(){
    c.width = innerWidth; c.height = innerHeight;
    stars = Array.from({length: Math.min(80, innerWidth/13)}, () => ({
      x: Math.random()*c.width, y: Math.random()*c.height,
      r: Math.random()*1.3+.3, s: Math.random()*0.3+0.07,
      p: Math.random()*Math.PI*2
    }));
  }
  resize(); addEventListener('resize', resize);
  (function tick(t){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(st=>{
      st.y -= st.s; if(st.y < -4){ st.y = c.height+4; st.x = Math.random()*c.width; }
      const tw = .3 + .6*Math.abs(Math.sin(t/900 + st.p));
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(180,190,255,${tw*.65})`; ctx.fill();
    });
    requestAnimationFrame(tick);
  })(0);
})();

/* ═══════════ بيانات المنحنى (كما هي) ═══════════ */
const ANCHORS = [
  [1,5],[21,950],[61,14e6],[111,2.99e9],[131,7.78e9],[181,54.8e9],
  [201,88.2e9],[221,131e9],[241,194e9],[271,352e9],[300,626e9]
];

const SUFFIXES = [
  ['','',1],
  ['K','ألف',1e3],['M','مليون',1e6],['B','مليار',1e9],['T','تريليون',1e12],
  ['Qa','',1e15],['Qi','',1e18],['Sx','',1e21],['Sp','',1e24],
  ['Oc','',1e27],['No','',1e30],['Dc','',1e33],
  ['Ud','',1e36],['Dd','',1e39],['Td','',1e42],
  ['Qad','',1e45],['Qid','',1e48],['Sxd','',1e51],['Spd','',1e54],
  ['Ocd','',1e57],['Nod','',1e60],['Vg','',1e63]
];

function formatAmount(n){
  if(!isFinite(n)) return '—';
  if(n < 1000) return n.toFixed(n < 10 ? 2 : 1).replace(/\.0$/,'');
  for(let i = SUFFIXES.length-1; i >= 0; i--){
    const [suf,,val] = SUFFIXES[i];
    if(val>1 && n >= val) return (n/val).toFixed(n/val >= 100 ? 0 : n/val >= 10 ? 1 : 2) + suf;
  }
  return n.toExponential(2);
}

function curveValue(level){
  const pts = ANCHORS;
  if(level <= pts[0][0]) return pts[0][1] * Math.pow(level / pts[0][0], 1);
  if(level >= pts[pts.length-1][0]){
    const [l1,p1] = pts[pts.length-2], [l2,p2] = pts[pts.length-1];
    const rate = Math.log(p2/p1) / (l2 - l1);
    return p2 * Math.exp(rate * (level - l2));
  }
  for(let i=0;i<pts.length-1;i++){
    const [l1,p1] = pts[i], [l2,p2] = pts[i+1];
    if(level >= l1 && level <= l2){
      const t = (level - l1) / (l2 - l1);
      return Math.exp(Math.log(p1) + t * (Math.log(p2) - Math.log(p1)));
    }
  }
  return NaN;
}

/* ═══════════ منتقي المضاعِف (K/M/B/...) ═══════════ */
let selectedSuffix = 1e9; // افتراضيًا B، الأكثر شيوعًا
function buildSuffixRow(){
  const row = document.getElementById('suffixRow');
  SUFFIXES.filter(s=>s[2]>=1e3 && s[2]<=1e24 && !['K','Sx','Sp'].includes(s[0])).forEach(([suf,,val])=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = suf;
    if(val === selectedSuffix) btn.classList.add('active');
    btn.onclick = () => {
      selectedSuffix = val;
      row.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      updatePreview();
    };
    row.appendChild(btn);
  });
}
function currentProdValue(){
  const raw = parseFloat(document.getElementById('curProdNum').value);
  if(isNaN(raw)) return NaN;
  return raw * selectedSuffix;
}
function updatePreview(){
  const v = currentProdValue();
  document.getElementById('fullValuePreview').textContent = isNaN(v) ? '—' : '$' + v.toLocaleString('en-US',{maximumFractionDigits:0}) + '/s';
}

/* ═══════════ أزرار سريعة ═══════════ */
function quickTarget(add){
  const cur = parseFloat(document.getElementById('curLevel').value) || 1;
  document.getElementById('targetLevel').value = cur + add;
}
function setTarget(v){ document.getElementById('targetLevel').value = v; }

/* ═══════════ عداد متحرك للنتيجة ═══════════ */
function animateNumber(el, target, dur){
  const start = performance.now();
  (function frame(now){
    const t = Math.min(1, (now - start)/dur);
    const eased = 1 - Math.pow(1 - t, 3);
    el.innerHTML = '$' + formatAmount(target * eased) + '<span class="unit">/s</span>';
    if(t < 1) requestAnimationFrame(frame);
  })(start);
}

function fail(msg){
  const btn = document.getElementById('calcBtn');
  btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
  alert(msg);
}

/* ═══════════ الحساب ═══════════ */
function calculate(){
  const curLevel = parseFloat(document.getElementById('curLevel').value);
  const targetLevel = parseFloat(document.getElementById('targetLevel').value);
  const curProd = currentProdValue();

  if(!curLevel || curLevel < 1) return fail('اكتب اللفل الحالي صح');
  if(!targetLevel || targetLevel < 1) return fail('اكتب اللفل المستهدف صح');
  if(isNaN(curProd) || curProd <= 0) return fail('اكتب قيمة الإنتاج الحالي واختار الوحدة (K, M, B...) صح');

  const scale = curveValue(targetLevel) / curveValue(curLevel);
  const predicted = curProd * scale;

  document.getElementById('resLevelLabel').textContent = 'LVL ' + targetLevel;
  animateNumber(document.getElementById('resultNumber'), predicted, 1200);
  document.getElementById('resultRaw').textContent =
    predicted.toLocaleString('en-US',{maximumFractionDigits:0}) + ' /s';
  document.getElementById('chipMultiplier').textContent =
    'x' + (scale >= 100 ? scale.toFixed(0) : scale.toFixed(2));
  document.getElementById('chipDiff').textContent = '+$' + formatAmount(predicted - curProd) + '/s';

  // شريط التقدم
  const pct = Math.max(0, Math.min(100, (curLevel/targetLevel)*100));
  document.getElementById('progFrom').textContent = 'LVL ' + curLevel;
  document.getElementById('progTo').textContent = 'LVL ' + targetLevel;
  document.getElementById('progPct').textContent = pct.toFixed(0) + '%';
  requestAnimationFrame(()=> document.getElementById('progFill').style.width = pct + '%');

  document.getElementById('resultBox').classList.add('show');
}

/* ═══════════ PWA / Offline (كما هو) ═══════════ */
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE = 'animal-growth-calc-v2';
    self.addEventListener('install', e => {
      self.skipWaiting();
      e.waitUntil(caches.open(CACHE).then(c => c.add(self.registration.scope)));
    });
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(cached => {
          const fetchPromise = fetch(e.request).then(res => {
            caches.open(CACHE).then(c => c.put(e.request, res.clone()));
            return res;
          }).catch(() => cached);
          return cached || fetchPromise;
        })
      );
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  window.addEventListener('load', () => navigator.serviceWorker.register(swUrl).catch(()=>{}));
}

window.addEventListener('DOMContentLoaded', ()=>{
  buildSuffixRow();
  document.getElementById('curProdNum').addEventListener('input', updatePreview);
});
</script>
